services:
  - type: web
    name: academix-sms
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:setup && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: "file:./backend/prisma/dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
